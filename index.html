<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STM32 RGB LED Simulator</title>
<style>
:root { --board:#263238; --panel:#f5f1e8; --lcd:#9fbd83; --ink:#17221f; --accent:#f1b24a; }
* { box-sizing:border-box; }
body { margin:0; min-height:100vh; display:grid; place-items:center; color:var(--ink); background:radial-gradient(circle at 20% 10%,#fff8df 0 18%,transparent 42%),linear-gradient(135deg,#d9e3de,#a8bcb5); font-family:Georgia,serif; }
main { width:min(940px,94vw); }
h1 { margin:0 0 8px; font-size:clamp(1.8rem,4vw,3rem); letter-spacing:0; }
.subtitle { margin:0 0 22px; font-family:system-ui,sans-serif; color:#42534d; }
.board { display:grid; grid-template-columns:1.15fr .85fr; gap:22px; padding:26px; background:var(--board); border:8px solid #182124; border-radius:8px; box-shadow:0 18px 40px #26323855; }
.panel { background:var(--panel); padding:22px; border-radius:4px; }
.panel h2 { margin:0 0 15px; font-size:1.15rem; }
.lcd { padding:14px 16px; color:#17371e; background:var(--lcd); border:7px solid #4f6048; border-radius:5px; box-shadow:inset 0 0 16px #30452866; font:700 1.35rem/1.35 'Courier New',monospace; min-height:91px; }
.lcd-line { white-space:pre; overflow:hidden; }
.controls { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:20px; }
button { border:0; border-bottom:4px solid #8d641d; border-radius:5px; padding:14px 12px; color:#241d11; background:var(--accent); font:700 1rem system-ui,sans-serif; cursor:pointer; }
button:active { transform:translateY(2px); border-bottom-width:2px; }
.hint { margin:13px 0 0; color:#64736c; font:0.88rem system-ui,sans-serif; }
.led-area { display:flex; justify-content:center; align-items:center; gap:24px; min-height:170px; }
.led-wrap { text-align:center; font:700 .9rem system-ui,sans-serif; }
.led { width:70px; aspect-ratio:1; margin-bottom:8px; border-radius:50%; opacity:.18; box-shadow:inset 0 -8px 12px #0005; transition:opacity .12s, box-shadow .12s; }
.led.on { opacity:1; box-shadow:0 0 28px 10px currentColor, inset 0 -8px 12px #0005; }
.red { color:#ef4444; background:#ef4444; } .green { color:#22c55e; background:#22c55e; } .blue { color:#3b82f6; background:#3b82f6; }
.status { margin-top:16px; padding:12px; background:#e5dfd0; font:0.9rem system-ui,sans-serif; }
.pinmap { margin-top:18px; display:grid; grid-template-columns:1fr 1fr; gap:8px; font:0.88rem system-ui,sans-serif; }
.pinmap span { padding:8px; background:#fffaf0; border-left:4px solid var(--accent); }
@media (max-width:700px) { .board { grid-template-columns:1fr; padding:16px; } .panel { padding:16px; } }
</style>
</head>
<body>
<main>
<h1>STM32 RGB LED Simulator</h1>
<p class="subtitle">แบบจำลองเมนู LCD และ GPIO สำหรับทดลองกดปุ่ม</p>
<section class="board" aria-label="STM32 development board simulator">
<div class="panel">
<h2>LCD 16 × 2</h2>
<div class="lcd" aria-live="polite"><div id="line1" class="lcd-line"></div><div id="line2" class="lcd-line"></div></div>
<div class="controls"><button id="sw1">SW1 · เลื่อนเมนู</button><button id="sw2">SW2 · เลือก</button></div>
<p class="hint">แป้นพิมพ์: N = SW1, S = SW2</p>
</div>
<div class="panel">
<h2>GPIO Output</h2>
<div class="led-area">
<div class="led-wrap"><div id="ledR" class="led red"></div>R<br>PC10</div>
<div class="led-wrap"><div id="ledG" class="led green"></div>G<br>PC11</div>
<div class="led-wrap"><div id="ledB" class="led blue"></div>B<br>PC12</div>
</div>
<div id="status" class="status">สถานะ: ปิดไฟทั้งหมด</div>
<div class="pinmap"><span>SW1: PA7</span><span>SW2: PA8</span><span>LCD RS: PB0</span><span>LCD EN: PB2</span></div>
</div>
</section>
</main>
<script>
const modes = ['R', 'G', 'B', 'ALL', 'RUN'];
let menuIndex = 0;
let mode = null;
let runIndex = 0;
let runTimer = null;
const line1 = document.querySelector('#line1');
const line2 = document.querySelector('#line2');
const status = document.querySelector('#status');
const leds = [document.querySelector('#ledR'), document.querySelector('#ledG'), document.querySelector('#ledB')];

function renderMenu() {
  line1.textContent = 'R  G  B ALL RUN';
  const positions = [0, 3, 6, 9, 13];
  line2.textContent = ' '.repeat(positions[menuIndex]) + '^';
}

function setLeds(values, text) {
  values.forEach((value, index) => leds[index].classList.toggle('on', value));
  status.textContent = 'สถานะ: ' + text;
}

function stopRun() {
  if (runTimer !== null) clearInterval(runTimer);
  runTimer = null;
}

function chooseMode() {
  stopRun();
  mode = modes[menuIndex];

  if (mode === 'R') setLeds([true, false, false], 'เปิด LED สีแดง');
  if (mode === 'G') setLeds([false, true, false], 'เปิด LED สีเขียว');
  if (mode === 'B') setLeds([false, false, true], 'เปิด LED สีน้ำเงิน');
  if (mode === 'ALL') setLeds([true, true, true], 'เปิด LED ทั้งหมด');

  if (mode === 'RUN') {
    runIndex = 0;
    setLeds([true, false, false], 'RUN: ไฟวิ่ง');
    runTimer = setInterval(() => {
      runIndex = (runIndex + 1) % 3;
      setLeds([runIndex === 0, runIndex === 1, runIndex === 2], 'RUN: ไฟวิ่ง');
    }, 200);
  }
}

document.querySelector('#sw1').addEventListener('click', () => {
  menuIndex = (menuIndex + 1) % modes.length;
  renderMenu();
});
document.querySelector('#sw2').addEventListener('click', chooseMode);
document.addEventListener('keydown', event => {
  if (event.key.toLowerCase() === 'n') document.querySelector('#sw1').click();
  if (event.key.toLowerCase() === 's') document.querySelector('#sw2').click();
});
renderMenu();
setLeds([false, false, false], 'ปิดไฟทั้งหมด');
</script>
</body>
</html>
